version: 1
name: gitops-delivery-platform
vcs: github

stages:
  - id: test
    kind: test
    needs: []
    timeout_minutes: 20
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit tests
        run: mvn -B -ntp verify
        working-directory: app

  - id: security
    kind: security
    needs: []
    timeout_minutes: 20
    steps:
      # OWASP Dependency-Check was REMOVED on 2026-09-05 at the user's request:
      # it downloads and unpacks the full NVD CVE feed on a cold runner cache,
      # routinely costing 5-15 minutes. Trivy covers the same Maven dependency
      # tree AND the container base image (which Dependency-Check never looked
      # at) in well under a minute. The Set up JDK step went with it - it existed
      # only to run the Maven plugin; Trivy scans the filesystem and needs no JDK.
      # The FAIL GATE IS UNCHANGED: HIGH/CRITICAL findings still fail the build.
      - name: Filesystem and config scan (Trivy)
        run: |
          set -euo pipefail
          # Trivy runs from its OFFICIAL CONTAINER IMAGE rather than a
          # marketplace action. A `uses:` reference is resolved by GitHub before
          # any step executes, so a tag that does not exist kills the whole job
          # during action resolution with no scan attempted. An image tag is
          # verified at pull time by the registry and fails with a clear error.
          TRIVY_IMAGE="aquasec/trivy:0.58.1"
          # --ignorefile points at .trivyignore.yaml, which carries SCOPED and
          # EXPIRING exceptions with written justifications. It holds exactly two
          # entries (AVD-AWS-0040 and AVD-AWS-0041 - two views of one fact: the
          # EKS public endpoint, which cannot be closed without a self-hosted
          # runner inside the VPC). The severity gate below is NOT relaxed.
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${HOME}/.cache/trivy:/root/.cache/trivy" \
            "$TRIVY_IMAGE" \
            filesystem \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --ignorefile /workspace/.trivyignore.yaml \
            --exit-code 1 \
            --no-progress \
            /workspace

  # PROVISION RUNS BEFORE IMAGE.
  #
  # It used to run after, which forced the image stage to create the ECR
  # repository imperatively with `aws ecr create-repository` so it had somewhere
  # to push. That gave ONE resource TWO owners: the CLI created it, then
  # aws_ecr_repository.app tried to create it again and terraform failed with
  # RepositoryAlreadyExistsException - every run, permanently, because the CLI
  # always won the race.
  #
  # Terraform is now the SOLE owner of the registry (as it already is of every
  # other AWS resource here), and the image stage READS the repository URL from
  # terraform state. Ordering provision first costs nothing: the cluster has to
  # exist before configure can deploy to it either way.
  - id: provision
    kind: provision
    needs: [test, security]
    timeout_minutes: 45
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      # The source CIDR allowlist for the Argo CD UI, in HCL list syntax.
      # Held as a SECRET rather than committed: this repository is public, and
      # an operator's home IP handed to a scanner is a gift. terraform's
      # variable has no default and rejects an EMPTY list, so a missing value
      # fails the apply rather than quietly rendering an unrestricted rule.
      #
      # As of 2026-09-05 this is ["0.0.0.0/0"] by explicit operator decision -
      # see the ACCEPTED RISK note on the variable in infra/variables.tf.
      TF_VAR_argocd_allowed_cidrs: ${{ secrets.ARGOCD_ALLOWED_CIDRS }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform init
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
        working-directory: infra
      - name: Adopt a pre-existing ECR repository into state
        run: |
          set -euo pipefail
          # Recovery path for state created before terraform owned the registry.
          # A previous pipeline revision created the repository with the AWS CLI,
          # so it exists in the account but not in state. Import it once; on a
          # clean account both branches are no-ops and terraform creates it.
          if terraform state show aws_ecr_repository.app >/dev/null 2>&1; then
            echo "aws_ecr_repository.app is already in state - nothing to adopt"
          elif aws ecr describe-repositories --region "$AWS_REGION" \
                 --repository-names "$TF_VAR_project_name" >/dev/null 2>&1; then
            echo "repository exists in AWS but not in state - importing"
            terraform import -input=false aws_ecr_repository.app "$TF_VAR_project_name"
          else
            echo "no pre-existing repository - terraform will create it"
          fi
        working-directory: infra
      - name: Terraform validate
        run: terraform validate
        working-directory: infra
      - name: Terraform apply
        run: terraform apply -input=false -auto-approve
        working-directory: infra
      - name: Report the ACM certificate status and validation record
        run: |
          set -euo pipefail
          # The certificate is requested but NOT waited on (see infra/acm.tf):
          # DNS for this zone lives in cPanel, so terraform cannot write the
          # validation record and aws_acm_certificate_validation would block
          # the apply for hours. Print what the operator needs instead.
          STATUS="$(terraform output -raw acm_certificate_status)"
          echo "ACM certificate status: $STATUS"
          if [ "$STATUS" = "ISSUED" ]; then
            echo "Certificate is issued - the Argo CD ingress will be created by configure."
            exit 0
          fi
          NAME="$(terraform output -raw acm_validation_name)"
          VALUE="$(terraform output -raw acm_validation_value)"
          HOSTNAME="$(terraform output -raw argocd_hostname)"
          ZONE="${HOSTNAME#*.}"
          SHORT="${NAME%.${ZONE}.}"
          echo "==================================================================="
          echo "ACTION REQUIRED - add this CNAME in the cPanel Zone Editor"
          echo "==================================================================="
          echo "Record type                 : CNAME"
          echo "Fully-qualified record name : ${NAME}"
          echo "Record value                : ${VALUE}"
          echo
          echo "cPanel usually APPENDS the zone (${ZONE}) to whatever you type."
          echo "If so, enter ONLY this in the Name field:"
          echo "  ${SHORT}"
          echo
          echo "Verify afterwards with:"
          echo "  dig +short CNAME ${NAME}"
          echo "It must return exactly: ${VALUE}"
          echo
          echo "A doubled zone suffix (…${ZONE}.${ZONE}) is the usual cPanel"
          echo "mistake and makes validation silently never complete."
          echo "==================================================================="
        working-directory: infra

  - id: image
    kind: build_push
    needs: [provision]
    timeout_minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_argocd_allowed_cidrs: ${{ secrets.ARGOCD_ALLOWED_CIDRS }}
      PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Build application jar
        run: mvn -B -ntp -DskipTests package
        working-directory: app
      - name: Read the ECR repository URL from terraform state
        run: |
          set -euo pipefail
          # Self-sufficient job: re-init with the SAME backend flags and read the
          # value from state rather than threading it through job outputs. The
          # repository URL embeds PROJECT_NAME, which is a secret, so GitHub
          # would silently DROP it as a job output.
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
          terraform output -raw ecr_repository_url > /tmp/ecr_url
        working-directory: infra
      - name: Log in to Amazon ECR
        run: |
          set -euo pipefail
          REGISTRY="$(cut -d/ -f1 /tmp/ecr_url)"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"
      - name: Build and push image tagged with commit SHA
        run: |
          set -euo pipefail
          IMAGE="$(cat /tmp/ecr_url):${GITHUB_SHA}"
          # The ECR repository is IMMUTABLE-tagged: a tag can never be rewritten
          # under a running Deployment. That also means re-running this pipeline
          # on the SAME commit must be a no-op rather than a failure.
          if aws ecr describe-images --region "$AWS_REGION" \
               --repository-name "$PROJECT_NAME" \
               --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "image for $GITHUB_SHA already present in ECR - skipping build and push"
            exit 0
          fi
          docker build -t "$IMAGE" app
          docker push "$IMAGE"
          echo "pushed image for $GITHUB_SHA"

  - id: configure
    kind: configure
    needs: [provision, image]
    timeout_minutes: 45
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_argocd_allowed_cidrs: ${{ secrets.ARGOCD_ALLOWED_CIDRS }}
      PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
      GITOPS_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      ARGOCD_ALLOWED_CIDRS: ${{ secrets.ARGOCD_ALLOWED_CIDRS }}
      ARGOCD_ADMIN_PASSWORD: ${{ secrets.ARGOCD_ADMIN_PASSWORD }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.33.0
      - name: Read infrastructure outputs from terraform state
        id: tf
        run: |
          set -euo pipefail
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
          terraform output -raw cluster_name > /tmp/cluster_name
          terraform output -raw alb_controller_role_arn > /tmp/albc_role_arn
          terraform output -raw ecr_repository_url > /tmp/ecr_url
          terraform output -raw vpc_id > /tmp/vpc_id
          terraform output -raw acm_certificate_arn > /tmp/acm_arn
          terraform output -raw acm_certificate_status > /tmp/acm_status
          terraform output -raw argocd_hostname > /tmp/argocd_hostname
        working-directory: infra
      - name: Update kubeconfig
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$(cat /tmp/cluster_name)"
          kubectl cluster-info
      - name: Install or upgrade Argo CD
        run: |
          set -euo pipefail
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
          helm upgrade --install argocd argo/argo-cd \
            --namespace argocd \
            --version 7.7.11 \
            --set configs.params."server\.insecure"=true \
            --wait --timeout 15m
      - name: Rotate the Argo CD admin password off the initial secret
        run: |
          set -euo pipefail
          # argocd-initial-admin-secret holds an auto-generated cluster-admin
          # password in plaintext in a namespace Secret, readable by anyone with
          # `kubectl get secret -n argocd`. It is a bootstrap artifact, not a
          # credential store. Replace it with a value held as a repository
          # secret, and delete the bootstrap secret so there is exactly one
          # source of truth.
          #
          # Argo CD reads the bcrypt hash from argocd-secret key
          # admin.password. htpasswd -B is bcrypt; -C 10 matches Argo's own
          # default cost. Writing admin.passwordMtime alongside it is REQUIRED:
          # Argo compares that timestamp against issued JWTs and invalidates
          # sessions older than the change, so omitting it would leave tokens
          # minted under the OLD password valid indefinitely.
          #
          # With the UI now reachable from any source address, this password is
          # the ONLY barrier in front of cluster-admin authority. Keep the
          # ARGOCD_ADMIN_PASSWORD secret long and unique, and rotate it here.
          if ! command -v htpasswd >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq apache2-utils
          fi
          HASH="$(htpasswd -nbBC 10 "" "$ARGOCD_ADMIN_PASSWORD" | tr -d ':\n' | sed 's/^\$2y/\$2a/')"
          MTIME="$(date -u +%FT%TZ)"
          kubectl -n argocd patch secret argocd-secret \
            -p "{\"stringData\":{\"admin.password\":\"${HASH}\",\"admin.passwordMtime\":\"${MTIME}\"}}"
          # Idempotent: absent on every run after the first.
          kubectl -n argocd delete secret argocd-initial-admin-secret --ignore-not-found
          # argocd-server caches the credential; restart so the new hash is live
          # before the verify stage or the operator tries to log in.
          kubectl -n argocd rollout restart deployment argocd-server
          kubectl -n argocd rollout status deployment argocd-server --timeout=5m
          echo "admin password rotated; argocd-initial-admin-secret removed"
      - name: Install AWS Load Balancer Controller
        run: |
          set -euo pipefail
          kubectl apply --server-side -f https://raw.githubusercontent.com/aws/eks-charts/v0.0.187/stable/aws-load-balancer-controller/crds/crds.yaml
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --namespace kube-system \
            --version 1.10.1 \
            --set clusterName="$(cat /tmp/cluster_name)" \
            --set region="$AWS_REGION" \
            --set vpcId="$(cat /tmp/vpc_id)" \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"="$(cat /tmp/albc_role_arn)" \
            --wait --timeout 10m
      - name: Create the Argo CD UI ingress once the certificate is issued
        run: |
          set -euo pipefail
          STATUS="$(cat /tmp/acm_status)"
          HOSTNAME="$(cat /tmp/argocd_hostname)"
          if [ "$STATUS" != "ISSUED" ]; then
            # PHASE 1. Attaching an unissued certificate to an ALB listener
            # fails, so skip the ingress rather than failing the deploy. The
            # provision stage printed the validation CNAME to add in cPanel.
            # This is a normal, successful outcome of the first deploy.
            echo "ACM certificate status is ${STATUS}, not ISSUED."
            echo "Skipping the Argo CD ingress - it will be created on the next"
            echo "deploy, once the validation CNAME is live and ACM has issued."
            echo "Use kubectl port-forward for UI access in the meantime:"
            echo "  kubectl -n argocd port-forward svc/argocd-server 8080:443"
            exit 0
          fi
          # PHASE 2. Certificate is issued; create the front door.
          #
          # FORMAT CONVERSION. The ARGOCD_ALLOWED_CIDRS secret holds HCL list
          # syntax (["1.2.3.4/32"]) because terraform consumes the same secret
          # as TF_VAR_argocd_allowed_cidrs. The ALB annotation needs a bare
          # comma-separated string. Strip brackets, quotes and spaces.
          ARGOCD_CIDR_LIST="$(printf '%s' "$ARGOCD_ALLOWED_CIDRS" \
            | tr -d '[]" ' )"
          # Refuse to render an ingress with an EMPTY allowlist. This check is
          # NOT about how wide the list is - it is about the list being absent.
          # The ALB controller treats a missing inbound-cidrs annotation as "no
          # restriction", so an unset or malformed secret would silently produce
          # an open console that nobody decided on. An explicitly configured
          # 0.0.0.0/0 is a decision and is allowed through (see below); an empty
          # value is a mistake and fails here.
          if [ -z "$ARGOCD_CIDR_LIST" ]; then
            echo "ERROR: the resolved CIDR allowlist is empty."
            echo "Refusing to create an internet-facing ingress for the Argo CD"
            echo "admin UI without an explicit source list. Check that the"
            echo "ARGOCD_ALLOWED_CIDRS secret is set to an HCL list, e.g."
            echo '  ["203.0.113.10/32"]'
            exit 1
          fi
          # 0.0.0.0/0 USED TO BE REFUSED HERE, mirroring a matching validation
          # rule on the terraform variable. Both were removed on 2026-09-05 on
          # the operator's explicit instruction, after the exposure and the two
          # safer alternatives (a second allowlisted CIDR, or SSO/OIDC with
          # admin.enabled=false) were presented and declined. See the ACCEPTED
          # RISK note in infra/variables.tf. Announce the exposure in the log so
          # it stays visible on every deploy rather than becoming invisible
          # default behaviour.
          case ",$ARGOCD_CIDR_LIST," in
            *,0.0.0.0/0,*)
              echo "NOTICE: the Argo CD admin UI is being exposed to 0.0.0.0/0."
              echo "Every source address on the internet can reach the login"
              echo "form. The ARGOCD_ADMIN_PASSWORD secret is the only barrier"
              echo "in front of cluster-admin authority over this cluster."
              echo "This is an accepted operator decision, not a default."
              echo "The durable fix is SSO/OIDC with admin.enabled=false."
              ;;
          esac
          export ARGOCD_HOSTNAME="$HOSTNAME"
          export ARGOCD_CERT_ARN="$(cat /tmp/acm_arn)"
          export ARGOCD_CIDR_LIST
          export PROJECT_NAME
          envsubst < gitops/argocd-ingress.yaml | kubectl apply -f -
          echo "Argo CD ingress applied for ${HOSTNAME}"
      - name: Confirm the GitOps repository is anonymously readable
        run: |
          set -euo pipefail
          # This repository is PUBLIC by deliberate choice, so Argo CD clones it
          # anonymously and no repository-credential Secret exists. Fail fast and
          # loudly here if that assumption ever stops holding - otherwise the
          # symptom appears minutes later as an opaque "Unknown" Application.
          if ! git ls-remote "${GITOPS_REPO_URL}.git" HEAD >/dev/null 2>&1; then
            echo "ERROR: ${GITOPS_REPO_URL} is not readable without credentials."
            echo "Either make the repository public again, or add a read-only"
            echo "GITOPS_PAT secret and restore the repository-credential step."
            exit 1
          fi
          echo "OK: repository is anonymously readable"
      - name: Apply app-of-apps root Application
        run: |
          set -euo pipefail
          export GITOPS_REPO_URL
          envsubst < gitops/root-app.yaml | kubectl apply -f -
      - name: Patch app-dev image tag onto the Application
        run: |
          set -euo pipefail
          ECR_URL="$(cat /tmp/ecr_url)"
          # The root Application creates app-dev; wait for it to exist before
          # patching. This is cluster state - the repository is not modified.
          DEADLINE=$((SECONDS + 300))
          until kubectl get application app-dev -n argocd >/dev/null 2>&1; do
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "app-dev Application was not created by the root app in time"
              kubectl get applications -n argocd
              exit 1
            fi
            sleep 10
          done
          kubectl patch application app-dev --namespace argocd --type merge \
            --patch "{\"spec\":{\"source\":{\"helm\":{\"parameters\":[{\"name\":\"image.repository\",\"value\":\"${ECR_URL}\"},{\"name\":\"image.tag\",\"value\":\"${GITHUB_SHA}\"}]}}}}"
      - name: Confirm the image parameters survived root's reconciliation
        run: |
          set -euo pipefail
          # The patch above writes CLUSTER state onto an object that the ROOT
          # Application manages from Git, where it is rendered with an empty
          # `parameters: []`. root therefore has ignoreDifferences on
          # /spec/source/helm/parameters - without it, selfHeal reverts this
          # patch within seconds and app-dev sits at sync=Unknown forever with
          # "image.repository is empty" (that is exactly how the previous deploy
          # failed).
          #
          # ignoreDifferences is easy to attach to the wrong Application and
          # fails SILENTLY when it is, so assert the outcome here rather than
          # trusting the patch. Watch across several reconcile loops: a revert
          # is not instantaneous.
          DEADLINE=$((SECONDS + 180))
          while true; do
            TAG="$(kubectl get application app-dev -n argocd \
              -o jsonpath='{.spec.source.helm.parameters[?(@.name=="image.tag")].value}' 2>/dev/null || true)"
            if [ "$TAG" != "$GITHUB_SHA" ]; then
              echo "ERROR: image.tag on app-dev is '${TAG:-<empty>}', expected the commit SHA."
              echo "The root Application reverted the patch, which means its"
              echo "ignoreDifferences for /spec/source/helm/parameters is missing"
              echo "or attached to the wrong Application."
              kubectl get application root -n argocd -o jsonpath='{.spec.ignoreDifferences}'
              exit 1
            fi
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "OK: image parameters stable on app-dev for 180s"
              break
            fi
            sleep 15
          done

  - id: verify
    kind: verify
    needs: [provision, configure]
    timeout_minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_argocd_allowed_cidrs: ${{ secrets.ARGOCD_ALLOWED_CIDRS }}
      ARGOCD_ALLOWED_CIDRS: ${{ secrets.ARGOCD_ALLOWED_CIDRS }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.33.0
      - name: Read cluster name from terraform state
        run: |
          set -euo pipefail
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
          terraform output -raw cluster_name > /tmp/cluster_name
          terraform output -raw acm_certificate_status > /tmp/acm_status
          terraform output -raw argocd_hostname > /tmp/argocd_hostname
        working-directory: infra
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$(cat /tmp/cluster_name)"
      - name: Wait for Argo CD Applications to be Synced and Healthy
        run: |
          set -euo pipefail
          for APP in root app-dev; do
            echo "waiting for Application/$APP"
            DEADLINE=$((SECONDS + 600))
            while true; do
              SYNC="$(kubectl get application "$APP" -n argocd -o jsonpath='{.status.sync.status}' 2>/dev/null || echo Unknown)"
              HEALTH="$(kubectl get application "$APP" -n argocd -o jsonpath='{.status.health.status}' 2>/dev/null || echo Unknown)"
              echo "  $APP sync=$SYNC health=$HEALTH"
              if [ "$SYNC" = "Synced" ] && [ "$HEALTH" = "Healthy" ]; then
                break
              fi
              if [ "$HEALTH" = "Degraded" ]; then
                echo "Application $APP is Degraded"
                kubectl describe application "$APP" -n argocd
                exit 1
              fi
              if [ "$SECONDS" -ge "$DEADLINE" ]; then
                echo "timed out waiting for $APP (sync=$SYNC health=$HEALTH)"
                # sync=Unknown means Argo could not RENDER the source. The
                # ComparisonError condition carries the helm template error and
                # is far more useful than the describe output alone.
                kubectl get application "$APP" -n argocd -o jsonpath='{.status.conditions}'
                echo
                kubectl describe application "$APP" -n argocd
                exit 1
              fi
              sleep 15
            done
          done
      - name: Resolve ingress endpoint and curl the service
        run: |
          set -euo pipefail
          DEADLINE=$((SECONDS + 600))
          while true; do
            HOST="$(kubectl get ingress -n app-dev -o jsonpath='{.items[0].status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)"
            if [ -n "$HOST" ]; then
              break
            fi
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "timed out waiting for ingress hostname"
              kubectl get ingress -n app-dev
              exit 1
            fi
            sleep 15
          done
          echo "ingress hostname: $HOST"
          curl --fail --show-error --silent --retry 20 --retry-delay 15 --retry-all-errors \
            "http://${HOST}/actuator/health"
      - name: Report the Argo CD UI endpoint
        run: |
          set -euo pipefail
          STATUS="$(cat /tmp/acm_status)"
          HOSTNAME="$(cat /tmp/argocd_hostname)"
          if [ "$STATUS" != "ISSUED" ]; then
            echo "Argo CD UI ingress not created yet (certificate ${STATUS})."
            echo "Add the validation CNAME printed by the provision stage, then"
            echo "run the deploy again. Until then, reach the UI with:"
            echo "  kubectl -n argocd port-forward svc/argocd-server 8080:443"
            exit 0
          fi
          # Wait for the ALB controller to publish the load balancer hostname,
          # then report BOTH names: the ALB hostname is what the operator must
          # CNAME to in cPanel.
          DEADLINE=$((SECONDS + 600))
          while true; do
            ALB="$(kubectl get ingress argocd-server -n argocd -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)"
            if [ -n "$ALB" ]; then
              break
            fi
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "timed out waiting for the Argo CD ALB hostname"
              kubectl describe ingress argocd-server -n argocd
              exit 1
            fi
            sleep 15
          done
          # Report the ACTUAL exposure rather than a fixed sentence. Claiming
          # the console is allowlisted when it is open to the internet would be
          # a false assurance printed on every deploy.
          CIDRS="$(printf '%s' "$ARGOCD_ALLOWED_CIDRS" | tr -d '[]" ')"
          echo "==================================================================="
          echo "Argo CD UI: https://${HOSTNAME}"
          echo "ALB hostname: ${ALB}"
          echo
          echo "If https://${HOSTNAME} does not resolve yet, add this in cPanel:"
          echo "  Type  : CNAME"
          echo "  Name  : ${HOSTNAME%%.*}"
          echo "  Value : ${ALB}"
          echo
          case ",$CIDRS," in
            *,0.0.0.0/0,*)
              echo "EXPOSURE: reachable from ANY source address on the internet."
              echo "The admin password is the only barrier in front of"
              echo "cluster-admin authority. Accepted operator decision."
              ;;
            *)
              echo "Reachable ONLY from the allowlisted source CIDRs. Any other"
              echo "source is refused by the ALB security group and will simply"
              echo "time out - that is the control working, not an outage."
              ;;
          esac
          echo "==================================================================="

rollback:
  strategy: manual
