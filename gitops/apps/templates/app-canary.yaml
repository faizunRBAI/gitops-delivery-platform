{{- if not .Values.repoURL }}
{{- fail "repoURL is empty - the root Application must pass it as a Helm parameter" }}
{{- end }}
{{- if not .Values.imageRepository }}
{{- fail "imageRepository is empty in gitops/apps/values.yaml - the image stage writes it from `terraform output -raw ecr_repository_url`" }}
{{- end }}
{{- if not .Values.imageTagCanary }}
{{- fail "imageTagCanary is empty in gitops/apps/values.yaml - the image stage commits the pushed image tag there" }}
{{- end }}
# ---------------------------------------------------------------------------
# app-canary — the same application chart, released with an Argo Rollouts
# canary strategy, in its own namespace.
#
# Rendered by the app-of-apps ROOT, which passes repoURL down as a Helm
# parameter. Nothing here hardcodes an org/repo pair.
#
# THE IMAGE TAG COMES FROM GIT (gitops/apps/values.yaml, key imageTagCanary,
# written and committed by the `image` stage), so a canary can be rolled back
# on its own without disturbing app-dev or app-bluegreen.
#
# MUTUAL EXCLUSION: blueGreen.enabled stays at its false default here, and the
# chart's `app.validateStrategy` helper fails the render if both are ever on.
#
# ingress.enabled=false: exercised in-cluster, no extra ALB.
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-canary
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL | quote }}
    targetRevision: {{ .Values.targetRevision | quote }}
    path: {{ .Values.chartPath | quote }}
    helm:
      releaseName: app-canary
      valueFiles:
        - values.yaml
      values: |
        canary:
          enabled: true
        ingress:
          enabled: false
      parameters:
        - name: image.repository
          value: {{ .Values.imageRepository | quote }}
        - name: image.tag
          value: {{ .Values.imageTagCanary | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: app-canary
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
  # KEEP THIS. A canary deliberately runs a MIX of replica counts as it steps
  # through its weights; Argo CD would read each intermediate state as drift and
  # selfHeal would collapse the canary before its pause elapsed. This exempts
  # the ROLLOUTS CONTROLLER's own writes — unrelated to the removed parameters
  # exemption, which existed only to hide CI writing to the cluster.
  ignoreDifferences:
    - group: argoproj.io
      kind: Rollout
      jsonPointers:
        - /spec/replicas
