# ---------------------------------------------------------------------------
# APP-OF-APPS ROOT
#
# The only object the pipeline applies directly. It renders gitops/apps/ as a
# Helm chart and creates every Application defined there, so adding an
# environment later means committing one template — never touching CI.
#
# $GITOPS_REPO_URL is substituted by the configure stage (envsubst) at apply
# time and passed DOWN to the children as a Helm parameter, so no manifest in
# this repository hardcodes an org/repo pair.
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: ${GITOPS_REPO_URL}
    targetRevision: main
    path: gitops/apps
    helm:
      releaseName: root
      valueFiles:
        - values.yaml
      parameters:
        - name: repoURL
          value: ${GITOPS_REPO_URL}
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    # Safe because Argo CD is the SOLE writer of gitops/ and chart/: the
    # pipeline never commits to either path, so selfHeal has nothing to fight.
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # THIS BELONGS HERE, ON THE ROOT — not on the child.
  #
  # The configure stage patches image.repository and image.tag onto the CHILD
  # Application (app-dev) with `kubectl patch`, which makes the running version
  # cluster state rather than Git state. But the object that MANAGES app-dev is
  # THIS root Application: root renders app-dev from gitops/apps/ with an empty
  # `parameters: []` and, with selfHeal on, reverts anything that differs.
  #
  # An ignoreDifferences declared on app-dev itself is powerless here — it
  # governs how app-dev compares ITS OWN managed resources (the Deployment,
  # Service and Ingress), not how root compares app-dev. The child cannot
  # exempt itself from its parent's reconciliation.
  #
  # Without this block the sequence is: configure patches the parameters, root
  # self-heals them back to [], the chart's image.repository guard fires, and
  # app-dev sits at sync=Unknown with a ComparisonError forever.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /spec/source/helm/parameters
