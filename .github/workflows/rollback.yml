name: rollback
'on':
  workflow_dispatch: {}
jobs:
  rollback:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_argocd_allowed_cidrs: ${{ secrets.ARGOCD_ALLOWED_CIDRS }}
      PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
      ROLLBACK_APP: ${{ vars.ROLLBACK_APPLICATION }}
      ROLLBACK_TAG: ${{ vars.ROLLBACK_IMAGE_TAG }}
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
    - name: Set up kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: v1.33.0
    - name: Resolve and validate the rollback target
      run: "set -euo pipefail\n# Default the application so the common case needs\
        \ ONE variable.\nAPP=\"${ROLLBACK_APP:-app-dev}\"\nif [ -z \"${ROLLBACK_TAG:-}\"\
        \ ]; then\n  echo \"ERROR: the ROLLBACK_IMAGE_TAG repository variable is not\
        \ set.\"\n  echo\n  echo \"Set it under:\"\n  echo \"  Settings -> Secrets\
        \ and variables -> Actions -> Variables\"\n  echo\n  echo \"  ROLLBACK_IMAGE_TAG\
        \   = <the commit SHA to roll back to>\"\n  echo \"  ROLLBACK_APPLICATION\
        \ = app-dev | app-bluegreen | app-canary\"\n  echo \"                    \
        \     (optional, defaults to app-dev)\"\n  echo\n  echo \"Then run this workflow\
        \ again.\"\n  exit 1\nfi\ncase \"$APP\" in\n  app-dev|app-bluegreen|app-canary)\
        \ ;;\n  *)\n    echo \"ERROR: ROLLBACK_APPLICATION must be one of\"\n    echo\
        \ \"  app-dev, app-bluegreen, app-canary\"\n    echo \"Got: '${APP}'\"\n \
        \   exit 1\n    ;;\nesac\necho \"APP=${APP}\" >> \"$GITHUB_ENV\"\necho \"\
        rollback target: ${APP} -> ${ROLLBACK_TAG}\"\n"
    - name: Read infrastructure outputs from terraform state
      run: "set -euo pipefail\n# Self-sufficient job (this workflow has no provision\
        \ stage to\n# inherit from): same backend flags, read what we need from state.\n\
        terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\nterraform\
        \ output -raw cluster_name > /tmp/cluster_name\nterraform output -raw ecr_repository_url\
        \ > /tmp/ecr_url\n"
      working-directory: infra
    - name: Confirm the requested tag exists in ECR
      run: "set -euo pipefail\n# FAIL BEFORE TOUCHING THE CLUSTER. Patching an Application\
        \ to a\n# tag that was never pushed produces ImagePullBackOff on every new\n\
        # pod - a broken deployment created BY the rollback that was meant\n# to fix\
        \ one. Checking ECR first turns that into a clean refusal.\nif ! aws ecr describe-images\
        \ --region \"$AWS_REGION\" \\\n       --repository-name \"$PROJECT_NAME\"\
        \ \\\n       --image-ids imageTag=\"$ROLLBACK_TAG\" >/dev/null 2>&1; then\n\
        \  echo \"ERROR: no image tagged '${ROLLBACK_TAG}' exists in ECR.\"\n  echo\
        \ \"Recently pushed tags (oldest to newest):\"\n  aws ecr describe-images\
        \ --region \"$AWS_REGION\" \\\n    --repository-name \"$PROJECT_NAME\" \\\n\
        \    --query 'sort_by(imageDetails,&imagePushedAt)[-20:].imageTags[0]' \\\n\
        \    --output text\n  exit 1\nfi\necho \"OK: ${ROLLBACK_TAG} exists in ECR\"\
        \n"
    - name: Update kubeconfig
      run: 'set -euo pipefail

        aws eks update-kubeconfig --region "$AWS_REGION" --name "$(cat /tmp/cluster_name)"

        kubectl cluster-info

        '
    - name: Patch the Application back to the requested tag
      run: "set -euo pipefail\nECR_URL=\"$(cat /tmp/ecr_url)\"\n# Record what we are\
        \ moving away from, so the log alone is enough\n# to undo the rollback.\n\
        PREVIOUS=\"$(kubectl get application \"$APP\" -n argocd \\\n  -o jsonpath='{.spec.source.helm.parameters[?(@.name==\"\
        image.tag\")].value}' 2>/dev/null || true)\"\necho \"rolling ${APP}: ${PREVIOUS:-<unset>}\
        \ -> ${ROLLBACK_TAG}\"\n# BOTH parameters again - a merge patch replaces the\
        \ whole list,\n# so omitting image.repository would blank it and fail the\
        \ render.\nkubectl patch application \"$APP\" --namespace argocd --type merge\
        \ \\\n  --patch \"{\\\"spec\\\":{\\\"source\\\":{\\\"helm\\\":{\\\"parameters\\\
        \":[{\\\"name\\\":\\\"image.repository\\\",\\\"value\\\":\\\"${ECR_URL}\\\"\
        },{\\\"name\\\":\\\"image.tag\\\",\\\"value\\\":\\\"${ROLLBACK_TAG}\\\"}]}}}}\"\
        \n{\n  echo \"### Rollback\"\n  echo \"\"\n  echo \"| field | value |\"\n\
        \  echo \"| --- | --- |\"\n  echo \"| application | \\`${APP}\\` |\"\n  echo\
        \ \"| previous tag | \\`${PREVIOUS:-<unset>}\\` |\"\n  echo \"| rolled to\
        \ | \\`${ROLLBACK_TAG}\\` |\"\n  echo \"\"\n  echo \"To undo, set ROLLBACK_IMAGE_TAG\
        \ to the previous tag and re-run.\"\n} >> \"$GITHUB_STEP_SUMMARY\"\n"
    - name: Wait for the application to converge on the rolled-back tag
      run: "set -euo pipefail\n# Prove the rollback took effect rather than reporting\
        \ success on\n# a patch that selfHeal may have reverted.\nDEADLINE=$((SECONDS\
        \ + 600))\nwhile true; do\n  TAG=\"$(kubectl get application \"$APP\" -n argocd\
        \ \\\n    -o jsonpath='{.spec.source.helm.parameters[?(@.name==\"image.tag\"\
        )].value}' 2>/dev/null || true)\"\n  SYNC=\"$(kubectl get application \"$APP\"\
        \ -n argocd -o jsonpath='{.status.sync.status}' 2>/dev/null || echo Unknown)\"\
        \n  HEALTH=\"$(kubectl get application \"$APP\" -n argocd -o jsonpath='{.status.health.status}'\
        \ 2>/dev/null || echo Unknown)\"\n  echo \"  tag=${TAG:-<empty>} sync=$SYNC\
        \ health=$HEALTH\"\n  if [ \"$TAG\" != \"$ROLLBACK_TAG\" ]; then\n    echo\
        \ \"ERROR: image.tag reverted to '${TAG:-<empty>}'.\"\n    echo \"The root\
        \ Application's ignoreDifferences for\"\n    echo \"/spec/source/helm/parameters\
        \ is missing or misattached.\"\n    exit 1\n  fi\n  if [ \"$SYNC\" = \"Synced\"\
        \ ] && [ \"$HEALTH\" = \"Healthy\" ]; then\n    echo \"rollback complete:\
        \ ${APP} is Synced and Healthy on ${ROLLBACK_TAG}\"\n    break\n  fi\n  if\
        \ [ \"$HEALTH\" = \"Degraded\" ]; then\n    echo \"ERROR: ${APP} is Degraded\
        \ after the rollback.\"\n    kubectl describe application \"$APP\" -n argocd\n\
        \    exit 1\n  fi\n  if [ \"$SECONDS\" -ge \"$DEADLINE\" ]; then\n    echo\
        \ \"timed out (sync=$SYNC health=$HEALTH)\"\n    kubectl get application \"\
        $APP\" -n argocd -o jsonpath='{.status.conditions}'\n    exit 1\n  fi\n  sleep\
        \ 15\ndone\necho\necho \"NOTE for app-bluegreen: a rollback creates a new\
        \ PREVIEW\"\necho \"ReplicaSet on the old tag and waits for promotion, because\"\
        \necho \"autoPromotionEnabled is false. Promote it to take traffic:\"\necho\
        \ \"  kubectl argo rollouts promote <rollout> -n app-bluegreen\"\n"
