        # can still be served from the failed-render cache. Restarting the\n# repo-server\
        \ empties that cache outright.\nkubectl -n argocd rollout restart deployment\
        \ argocd-repo-server\nkubectl -n argocd rollout status deployment argocd-repo-server\
        \ --timeout=5m\n# Ask each Application to re-compare against a freshly rendered\
        \ source.\nfor APP in app-dev app-bluegreen app-canary; do\n  kubectl -n argocd\
        \ annotate application \"$APP\" \\\n    argocd.argoproj.io/refresh=hard --overwrite\n\
        done\necho \"repo-server cache cleared and a hard refresh requested\"\n"
    - name: Confirm the image parameters survived root's reconciliation
      run: "set -euo pipefail\n# The patch above writes CLUSTER state onto objects\
        \ that the ROOT\n# Application manages from Git, where they are rendered with\
        \ an empty\n# `parameters: []`. root therefore has ignoreDifferences on\n\
        # /spec/source/helm/parameters - without it, selfHeal reverts the\n# patch\
        \ within seconds and the child sits at sync=Unknown forever with\n# \"image.repository\
        \ is empty\" (that is exactly how a previous deploy\n# failed).\n#\n# ignoreDifferences\
        \ is easy to attach to the wrong Application and\n# fails SILENTLY when it\
        \ is, so assert the outcome here rather than\n# trusting the patch. Watch\
        \ across several reconcile loops: a revert\n# is not instantaneous.\nDEADLINE=$((SECONDS\
        \ + 180))\nwhile true; do\n  for APP in app-dev app-bluegreen app-canary;\
        \ do\n    TAG=\"$(kubectl get application \"$APP\" -n argocd \\\n      -o\
        \ jsonpath='{.spec.source.helm.parameters[?(@.name==\"image.tag\")].value}'\
        \ 2>/dev/null || true)\"\n    if [ \"$TAG\" != \"$GITHUB_SHA\" ]; then\n \
        \     echo \"ERROR: image.tag on ${APP} is '${TAG:-<empty>}', expected the\
        \ commit SHA.\"\n      echo \"The root Application reverted the patch, which\
        \ means its\"\n      echo \"ignoreDifferences for /spec/source/helm/parameters\
        \ is missing\"\n      echo \"or attached to the wrong Application.\"\n   \
        \   kubectl get application root -n argocd -o jsonpath='{.spec.ignoreDifferences}'\n\
        \      exit 1\n    fi\n  done\n  if [ \"$SECONDS\" -ge \"$DEADLINE\" ]; then\n\
        \    echo \"OK: image parameters stable on all applications for 180s\"\n \
        \   break\n  fi\n  sleep 15\ndone\n"
  verify:
    runs-on: ubuntu-latest
    needs:
    - provision
    - configure
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_argocd_allowed_cidrs: ${{ secrets.ARGOCD_ALLOWED_CIDRS }}
      ARGOCD_ALLOWED_CIDRS: ${{ secrets.ARGOCD_ALLOWED_CIDRS }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
    - name: Set up kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: v1.33.0
    - name: Read cluster name from terraform state
      run: "set -euo pipefail\nterraform init -input=false -reconfigure \\\n  -backend-config=\"\
        bucket=${{ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\nterraform\
        \ output -raw cluster_name > /tmp/cluster_name\nterraform output -raw acm_certificate_status\
        \ > /tmp/acm_status\nterraform output -raw argocd_hostname > /tmp/argocd_hostname\n"
      working-directory: infra
    - name: Update kubeconfig
      run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$(cat /tmp/cluster_name)"
    - name: Wait for Argo CD Applications to be Synced and Healthy
      run: "set -euo pipefail\nfor APP in root app-dev app-bluegreen app-canary; do\n\
        \  echo \"waiting for Application/$APP\"\n  DEADLINE=$((SECONDS + 600))\n\
        \  while true; do\n    SYNC=\"$(kubectl get application \"$APP\" -n argocd\
        \ -o jsonpath='{.status.sync.status}' 2>/dev/null || echo Unknown)\"\n   \
        \ HEALTH=\"$(kubectl get application \"$APP\" -n argocd -o jsonpath='{.status.health.status}'\
        \ 2>/dev/null || echo Unknown)\"\n    echo \"  $APP sync=$SYNC health=$HEALTH\"\
        \n    if [ \"$SYNC\" = \"Synced\" ] && [ \"$HEALTH\" = \"Healthy\" ]; then\n\
        \      break\n    fi\n    if [ \"$HEALTH\" = \"Degraded\" ]; then\n      echo\
        \ \"Application $APP is Degraded\"\n      kubectl describe application \"\
        $APP\" -n argocd\n      exit 1\n    fi\n    if [ \"$SECONDS\" -ge \"$DEADLINE\"\
        \ ]; then\n      echo \"timed out waiting for $APP (sync=$SYNC health=$HEALTH)\"\
        \n      # sync=Unknown means Argo could not RENDER the source. The\n     \
        \ # ComparisonError condition carries the helm template error and\n      #\
        \ is far more useful than the describe output alone. A \"(cached)\"\n    \
        \  # prefix means a STALE failed render - the configure stage's\n      # repo-server\
        \ restart is what clears it.\n      kubectl get application \"$APP\" -n argocd\
        \ -o jsonpath='{.status.conditions}'\n      echo\n      kubectl describe application\
        \ \"$APP\" -n argocd\n      exit 1\n    fi\n    sleep 15\n  done\ndone\n"
    - name: Confirm the Rollout workloads reached a stable state
      run: "set -euo pipefail\n# A blue/green Rollout with autoPromotionEnabled=false\
        \ PAUSES at\n# `Paused` on its FIRST revision by design, waiting for a human\n\
        # promotion. Treat Healthy and Paused as acceptable resting states and\n#\
        \ fail only on Degraded - otherwise every first deploy of the\n# blue/green\
        \ instance would \"fail\" while behaving exactly as designed.\nfor NS in app-bluegreen\
        \ app-canary; do\n  echo \"--- namespace $NS\"\n  DEADLINE=$((SECONDS + 600))\n\
        \  while true; do\n    PHASE=\"$(kubectl get rollout -n \"$NS\" \\\n     \
        \ -o jsonpath='{.items[0].status.phase}' 2>/dev/null || true)\"\n    echo\
        \ \"  rollout phase=${PHASE:-<none>}\"\n    case \"$PHASE\" in\n      Healthy|Paused)\n\
        \        echo \"  OK ($PHASE)\"\n        break\n        ;;\n      Degraded)\n\
        \        echo \"rollout in $NS is Degraded\"\n        kubectl describe rollout\
        \ -n \"$NS\"\n        kubectl get pods -n \"$NS\"\n        exit 1\n      \
        \  ;;\n    esac\n    if [ \"$SECONDS\" -ge \"$DEADLINE\" ]; then\n      echo\
        \ \"timed out waiting for the rollout in $NS (phase=${PHASE:-<none>})\"\n\
        \      kubectl describe rollout -n \"$NS\"\n      kubectl get pods -n \"$NS\"\
        \n      exit 1\n    fi\n    sleep 15\n  done\ndone\necho\necho \"Blue/green\
        \ promotion is MANUAL by design. To promote:\"\necho \"  kubectl argo rollouts\
        \ promote <rollout> -n app-bluegreen\"\n"
    - name: Resolve ingress endpoint and curl the service
      run: "set -euo pipefail\nDEADLINE=$((SECONDS + 600))\nwhile true; do\n  HOST=\"\
        $(kubectl get ingress -n app-dev -o jsonpath='{.items[0].status.loadBalancer.ingress[0].hostname}'\
        \ 2>/dev/null || true)\"\n  if [ -n \"$HOST\" ]; then\n    break\n  fi\n \
        \ if [ \"$SECONDS\" -ge \"$DEADLINE\" ]; then\n    echo \"timed out waiting\
        \ for ingress hostname\"\n    kubectl get ingress -n app-dev\n    exit 1\n\
        \  fi\n  sleep 15\ndone\necho \"ingress hostname: $HOST\"\ncurl --fail --show-error\
        \ --silent --retry 20 --retry-delay 15 --retry-all-errors \\\n  \"http://${HOST}/actuator/health\"\
        \n"
    - name: Report the Argo CD UI endpoint
      run: "set -euo pipefail\nSTATUS=\"$(cat /tmp/acm_status)\"\nHOSTNAME=\"$(cat\
        \ /tmp/argocd_hostname)\"\nif [ \"$STATUS\" != \"ISSUED\" ]; then\n  echo\
        \ \"Argo CD UI ingress not created yet (certificate ${STATUS}).\"\n  echo\
        \ \"Add the validation CNAME printed by the provision stage, then\"\n  echo\
        \ \"run the deploy again. Until then, reach the UI with:\"\n  echo \"  kubectl\
        \ -n argocd port-forward svc/argocd-server 8080:443\"\n  exit 0\nfi\n# Wait\
        \ for the ALB controller to publish the load balancer hostname,\n# then report\
        \ BOTH names: the ALB hostname is what the operator must\n# CNAME to in cPanel.\n\
        DEADLINE=$((SECONDS + 600))\nwhile true; do\n  ALB=\"$(kubectl get ingress\
        \ argocd-server -n argocd -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'\
        \ 2>/dev/null || true)\"\n  if [ -n \"$ALB\" ]; then\n    break\n  fi\n  if\
        \ [ \"$SECONDS\" -ge \"$DEADLINE\" ]; then\n    echo \"timed out waiting for\
        \ the Argo CD ALB hostname\"\n    kubectl describe ingress argocd-server -n\
        \ argocd\n    exit 1\n  fi\n  sleep 15\ndone\n# Report the ACTUAL exposure\
        \ rather than a fixed sentence. Claiming\n# the console is allowlisted when\
        \ it is open to the internet would be\n# a false assurance printed on every\
        \ deploy.\nCIDRS=\"$(printf '%s' \"$ARGOCD_ALLOWED_CIDRS\" | tr -d '[]\" ')\"\
        \necho \"===================================================================\"\
        \necho \"Argo CD UI: https://${HOSTNAME}\"\necho \"ALB hostname: ${ALB}\"\n\
        echo\necho \"If https://${HOSTNAME} does not resolve yet, add this in cPanel:\"\
        \necho \"  Type  : CNAME\"\necho \"  Name  : ${HOSTNAME%%.*}\"\necho \"  Value\
        \ : ${ALB}\"\necho\ncase \",$CIDRS,\" in\n  *,0.0.0.0/0,*)\n    echo \"EXPOSURE:\
        \ reachable from ANY source address on the internet.\"\n    echo \"The admin\
        \ password is the only barrier in front of\"\n    echo \"cluster-admin authority.\
        \ Accepted operator decision.\"\n    ;;\n  *)\n    echo \"Reachable ONLY from\
        \ the allowlisted source CIDRs. Any other\"\n    echo \"source is refused\
        \ by the ALB security group and will simply\"\n    echo \"time out - that\
        \ is the control working, not an outage.\"\n    ;;\nesac\necho \"===================================================================\"\
        \n"
