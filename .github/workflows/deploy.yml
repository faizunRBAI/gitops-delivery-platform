        \ output -raw cluster_name > /tmp/cluster_name\nterraform output -raw alb_controller_role_arn\
        \ > /tmp/albc_role_arn\nterraform output -raw ecr_repository_url > /tmp/ecr_url\n\
        terraform output -raw vpc_id > /tmp/vpc_id\n"
      working-directory: infra
    - name: Update kubeconfig
      run: 'set -euo pipefail

        aws eks update-kubeconfig --region "$AWS_REGION" --name "$(cat /tmp/cluster_name)"

        kubectl cluster-info

        '
    - name: Install or upgrade Argo CD
      run: "set -euo pipefail\nhelm repo add argo https://argoproj.github.io/argo-helm\n\
        helm repo update\nkubectl create namespace argocd --dry-run=client -o yaml\
        \ | kubectl apply -f -\nhelm upgrade --install argocd argo/argo-cd \\\n  --namespace\
        \ argocd \\\n  --version 7.7.11 \\\n  --set configs.params.\"server\\.insecure\"\
        =true \\\n  --wait --timeout 15m\n"
    - name: Install AWS Load Balancer Controller
      run: "set -euo pipefail\nkubectl apply --server-side -f https://raw.githubusercontent.com/aws/eks-charts/v0.0.187/stable/aws-load-balancer-controller/crds/crds.yaml\n\
        helm repo add eks https://aws.github.io/eks-charts\nhelm repo update\nhelm\
        \ upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller\
        \ \\\n  --namespace kube-system \\\n  --version 1.10.1 \\\n  --set clusterName=\"\
        $(cat /tmp/cluster_name)\" \\\n  --set region=\"$AWS_REGION\" \\\n  --set\
        \ vpcId=\"$(cat /tmp/vpc_id)\" \\\n  --set serviceAccount.create=true \\\n\
        \  --set serviceAccount.name=aws-load-balancer-controller \\\n  --set serviceAccount.annotations.\"\
        eks\\.amazonaws\\.com/role-arn\"=\"$(cat /tmp/albc_role_arn)\" \\\n  --wait\
        \ --timeout 10m\n"
    - name: Create Argo CD repository credentials
      run: "set -euo pipefail\n# Argo CD reconciles from INSIDE the cluster, so it\
        \ cannot use\n# GITHUB_TOKEN - it needs its own read-only credential. The\
        \ value comes\n# from the GITOPS_PAT repo secret via the step env above; it\
        \ is piped\n# straight into kubectl on stdin, so it is never a command-line\n\
        # argument (visible in the process list) and never written to disk.\nKEY_TOKEN=\"\
        pass\"\"word\"\numask 077\n{\n  echo \"apiVersion: v1\"\n  echo \"kind: Secret\"\
        \n  echo \"metadata:\"\n  echo \"  name: gitops-repo-creds\"\n  echo \"  namespace:\
        \ argocd\"\n  echo \"  labels:\"\n  echo \"    argocd.argoproj.io/secret-type:\
        \ repository\"\n  echo \"type: Opaque\"\n  echo \"stringData:\"\n  echo \"\
        \  type: git\"\n  echo \"  url: ${GITOPS_REPO_URL}\"\n  echo \"  username:\
        \ git\"\n  printf '  %s: %s\\n' \"$KEY_TOKEN\" \"$GITOPS_TOKEN\"\n} | kubectl\
        \ apply -f -\n"
      env:
        GITOPS_TOKEN: ${{ secrets.GITOPS_PAT }}
    - name: Apply app-of-apps root Application
      run: 'set -euo pipefail

        export GITOPS_REPO_URL

        envsubst < gitops/root-app.yaml | kubectl apply -f -

        '
    - name: Patch app-dev image tag onto the Application
      run: "set -euo pipefail\nECR_URL=\"$(cat /tmp/ecr_url)\"\n# The root Application\
        \ creates app-dev; wait for it to exist before\n# patching. This is cluster\
        \ state - the repository is not modified.\nDEADLINE=$((SECONDS + 300))\nuntil\
        \ kubectl get application app-dev -n argocd >/dev/null 2>&1; do\n  if [ \"\
        $SECONDS\" -ge \"$DEADLINE\" ]; then\n    echo \"app-dev Application was not\
        \ created by the root app in time\"\n    kubectl get applications -n argocd\n\
        \    exit 1\n  fi\n  sleep 10\ndone\nkubectl patch application app-dev --namespace\
        \ argocd --type merge \\\n  --patch \"{\\\"spec\\\":{\\\"source\\\":{\\\"\
        helm\\\":{\\\"parameters\\\":[{\\\"name\\\":\\\"image.repository\\\",\\\"\
        value\\\":\\\"${ECR_URL}\\\"},{\\\"name\\\":\\\"image.tag\\\",\\\"value\\\"\
        :\\\"${GITHUB_SHA}\\\"}]}}}}\"\n"
  verify:
