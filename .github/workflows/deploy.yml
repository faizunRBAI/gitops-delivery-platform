        \ -o jsonpath='{.status.conditions}'\n      echo\n      kubectl describe application\
        \ \"$APP\" -n argocd\n      exit 1\n    fi\n    sleep 15\n  done\ndone\n"
    - name: Resolve ingress endpoint and curl the service
      run: "set -euo pipefail\nDEADLINE=$((SECONDS + 600))\nwhile true; do\n  HOST=\"\
        $(kubectl get ingress -n app-dev -o jsonpath='{.items[0].status.loadBalancer.ingress[0].hostname}'\
        \ 2>/dev/null || true)\"\n  if [ -n \"$HOST\" ]; then\n    break\n  fi\n \
        \ if [ \"$SECONDS\" -ge \"$DEADLINE\" ]; then\n    echo \"timed out waiting\
        \ for ingress hostname\"\n    kubectl get ingress -n app-dev\n    exit 1\n\
        \  fi\n  sleep 15\ndone\necho \"ingress hostname: $HOST\"\ncurl --fail --show-error\
        \ --silent --retry 20 --retry-delay 15 --retry-all-errors \\\n  \"http://${HOST}/actuator/health\"\
        \n"
    - name: Report the Argo CD UI endpoint
      run: "set -euo pipefail\nSTATUS=\"$(cat /tmp/acm_status)\"\nHOSTNAME=\"$(cat\
        \ /tmp/argocd_hostname)\"\nif [ \"$STATUS\" != \"ISSUED\" ]; then\n  echo\
        \ \"Argo CD UI ingress not created yet (certificate ${STATUS}).\"\n  echo\
        \ \"Add the validation CNAME printed by the provision stage, then\"\n  echo\
        \ \"run the deploy again. Until then, reach the UI with:\"\n  echo \"  kubectl\
        \ -n argocd port-forward svc/argocd-server 8080:443\"\n  exit 0\nfi\n# Wait\
        \ for the ALB controller to publish the load balancer hostname,\n# then report\
        \ BOTH names: the ALB hostname is what the operator must\n# CNAME to in cPanel.\n\
        DEADLINE=$((SECONDS + 600))\nwhile true; do\n  ALB=\"$(kubectl get ingress\
        \ argocd-server -n argocd -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'\
        \ 2>/dev/null || true)\"\n  if [ -n \"$ALB\" ]; then\n    break\n  fi\n  if\
        \ [ \"$SECONDS\" -ge \"$DEADLINE\" ]; then\n    echo \"timed out waiting for\
        \ the Argo CD ALB hostname\"\n    kubectl describe ingress argocd-server -n\
        \ argocd\n    exit 1\n  fi\n  sleep 15\ndone\necho \"===================================================================\"\
        \necho \"Argo CD UI: https://${HOSTNAME}\"\necho \"ALB hostname: ${ALB}\"\n\
        echo\necho \"If https://${HOSTNAME} does not resolve yet, add this in cPanel:\"\
        \necho \"  Type  : CNAME\"\necho \"  Name  : ${HOSTNAME%%.*}\"\necho \"  Value\
        \ : ${ALB}\"\necho\necho \"Reachable ONLY from the allowlisted source CIDR.\
        \ Any other\"\necho \"source is refused by the ALB security group and will\
        \ simply\"\necho \"time out - that is the control working, not an outage.\"\
        \necho \"===================================================================\"\
        \n"
