  configure:
    runs-on: ubuntu-latest
    needs:
    - provision
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
      GITOPS_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.16.3
    - name: Set up kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: v1.33.0
    - id: tf
      name: Read infrastructure outputs from terraform state
      run: "set -euo pipefail\nterraform init -input=false -reconfigure \\\n  -backend-config=\"\
