    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: Build application jar
      run: mvn -B -ntp -DskipTests package
      working-directory: app
    - id: ecr
      name: Log in to Amazon ECR
      run: "set -euo pipefail\nACCOUNT_ID=\"$(aws sts get-caller-identity --query\
        \ Account --output text)\"\nREGISTRY=\"${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com\"\
        \naws ecr get-login-password --region \"$AWS_REGION\" \\\n  | docker login\
        \ --username AWS --password-stdin \"$REGISTRY\"\necho \"registry=${REGISTRY}\"\
        \ >> \"$GITHUB_OUTPUT\"\n"
    - name: Ensure ECR repository exists
      run: "set -euo pipefail\naws ecr describe-repositories --region \"$AWS_REGION\"\
        \ --repository-names \"$PROJECT_NAME\" \\\n  || aws ecr create-repository\
        \ --region \"$AWS_REGION\" --repository-name \"$PROJECT_NAME\" \\\n      \
        \ --image-tag-mutability IMMUTABLE \\\n       --image-scanning-configuration\
        \ scanOnPush=true \\\n       --tags Key=Project,Value=\"$PROJECT_NAME\" Key=ManagedBy,Value=udap\n"
    - name: Build and push image tagged with commit SHA
      run: "set -euo pipefail\nIMAGE=\"${{ steps.ecr.outputs.registry }}/${PROJECT_NAME}:${GITHUB_SHA}\"\
        \n# The ECR repository is IMMUTABLE-tagged: a tag can never be rewritten\n\
        # under a running Deployment. That also means re-running this pipeline\n#\
        \ on the SAME commit must be a no-op rather than a failure.\nif aws ecr describe-images\
        \ --region \"$AWS_REGION\" \\\n     --repository-name \"$PROJECT_NAME\" \\\
        \n     --image-ids imageTag=\"$GITHUB_SHA\" >/dev/null 2>&1; then\n  echo\
        \ \"image for $GITHUB_SHA already present in ECR - skipping build and push\"\
        \n  exit 0\nfi\ndocker build -t \"$IMAGE\" app\ndocker push \"$IMAGE\"\necho\
        \ \"pushed $IMAGE\"\n"
  provision:
    runs-on: ubuntu-latest
    needs:
