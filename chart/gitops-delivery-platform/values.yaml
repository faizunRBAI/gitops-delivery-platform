# ---------------------------------------------------------------------------
# DEFAULTS = the plain Deployment world (app-dev uses these unchanged).
#
# blueGreen.enabled and canary.enabled are MUTUALLY EXCLUSIVE and both default
# to false, so this file renders a Deployment + Service + Ingress. The
# app-bluegreen and app-canary Applications (gitops/apps/templates/) each flip
# exactly one of them via an Argo CD Helm parameter.
#
# When either is on, an Argo Rollouts Rollout replaces the Deployment and the
# `app.rolloutEnabled` helper suppresses the plain Service and Ingress. The
# `app.validateStrategy` helper fails the render if both are switched on.
# ---------------------------------------------------------------------------

replicaCount: 2

image:
  # repository is patched onto the Argo CD Application by the configure stage
  # (the ECR URL comes from `terraform output -raw ecr_repository_url`).
  repository: ""
  # NEVER commit a real tag here. Argo CD receives it as a Helm parameter, so a
  # deploy leaves this repository untouched and selfHeal has nothing to fight.
  tag: ""
  pullPolicy: Always

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  # Set FALSE by app-bluegreen and app-canary: each enabled Ingress provisions a
  # separate billable ALB. Also force-suppressed whenever a Rollout is active,
  # because the plain Service it targets does not render then.
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
  # No host: traffic is served on the ALB's own DNS name in Phase 1.
  # A real domain + ACM certificate is a listed optional enhancement.
  host: ""
  path: /
  pathType: Prefix

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    # Memory limit only. A CPU limit throttles the JVM during startup and makes
    # readiness flap on a t3.medium.
    memory: 768Mi

probes:
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 20
    periodSeconds: 10
    failureThreshold: 6
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 45
    periodSeconds: 20
    failureThreshold: 3

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

env:
  APP_NAME: gitops-delivery-platform

# ---------------------------------------------------------------------------
# Argo Rollouts — BLUE/GREEN.
#
# Enabled by the app-bluegreen Application. Two full ReplicaSets exist during a
# release: the live one behind the ACTIVE service, the new one behind PREVIEW.
#
# activeService / previewService are SUFFIXES. The chart expands them against
# the release fullname (helpers app.activeServiceName / app.previewServiceName)
# and renders the matching Services in templates/rollout-services.yaml — the
# Rollouts controller requires both to exist and does not create them.
#
# autoPromotionEnabled: false means the preview waits for a human:
#   kubectl argo rollouts promote app-bluegreen-gitops-delivery-platform -n app-bluegreen
# ---------------------------------------------------------------------------
blueGreen:
  enabled: false
  autoPromotionEnabled: false
  scaleDownDelaySeconds: 30
  previewService: preview
  activeService: active

# ---------------------------------------------------------------------------
# Argo Rollouts — CANARY.
#
# Enabled by the app-canary Application. With no trafficRouting provider these
# weights shift the PROPORTION OF PODS, not a precise share of requests: at
# setWeight 20 with replicaCount 2, roughly one pod runs the new version.
# Precise weighted routing needs an ALB traffic-router integration (optional
# enhancement). The pauses are the real control — the rollout stops there until
# the duration elapses, or indefinitely if you remove `duration`.
#
# analysis.enabled stays false: automatic promotion needs a metrics provider
# (Prometheus) that this cluster does not run yet.
# ---------------------------------------------------------------------------
canary:
  enabled: false
  steps:
    - setWeight: 20
    - pause: {duration: 60}
    - setWeight: 50
    - pause: {duration: 60}
  analysis:
    enabled: false
