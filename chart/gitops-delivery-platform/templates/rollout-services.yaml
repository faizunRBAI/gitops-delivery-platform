{{- if .Values.blueGreen.enabled }}
{{/*
BLUE/GREEN REQUIRES TWO SERVICES THAT ALREADY EXIST.

The Rollout's blueGreen strategy names an activeService and a previewService and
expects to FIND them — the controller mutates their selectors to point at the
right ReplicaSet, it does not create them. A Rollout referencing a missing
Service is admitted and then stalls, which reads like a broken image pull.

Neither Service carries a pod selector of its own here beyond the standard
selectorLabels: the Rollouts controller injects a rollouts-pod-template-hash
into each one to bind it to the active or preview ReplicaSet. That injected key
is exactly why these must NOT be reconciled away by something else — they are
part of the Rollout's machinery, not ordinary Services.

Only these two render under blue/green; templates/service.yaml is suppressed so
nothing else claims the same role.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.activeServiceName" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/component: active
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "app.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.previewServiceName" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/component: preview
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "app.selectorLabels" . | nindent 4 }}
{{- end }}
